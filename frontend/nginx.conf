#
# Limit the request rate to 50 requests per second per IP address to prevent DDoS attack
#
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;

#
# Set a response status code that is returned to rejected requests
#
limit_req_status 429;

server
{
	listen 80;
	root /usr/share/nginx/html;
	index index.html;

	# Enable rate limiting to prevent Brute force attacks, DoS and DDoS attacks, and Web scraping
	limit_req zone=mylimit burst=100 nodelay;

	# Queue #12 Phase C: gzip for compressible text assets (none was enabled;
	# JS/CSS were served identity-encoded).
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

	# Queue #12 Phase C: Vite build output under these directories is
	# content-hashed, so it can be cached immutably for a year.
	location /entries/
	{
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /chunks/
	{
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /assets/
	{
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Queue #12 Phase C: the HTML shell must revalidate on every load so a
	# new deploy takes effect immediately (the ETag makes this a cheap 304).
	location = /index.html
	{
		add_header Cache-Control "no-cache";
	}

	location /
	{
		# First attempt to serve request as file, then as directory,
		# then as index.html, then fall back to displaying a 404.
		try_files $uri $uri/ /index.html =404;
	}

	location /cdn
	{
		alias /var/www/cdn;
	}
}
