#
# Limit the request rate to 50 requests per second per IP address to prevent DDoS attack
#
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;

#
# Set a response status code that is returned to rejected requests
#
limit_req_status 429;

server
{
	listen 80;
	root /usr/share/nginx/html;
	index index.html;

	# Rate limiting lives in `location /` and `location = /index.html` only
	# (the HTML shell). Content-hashed statics (/entries/, /chunks/,
	# /assets/) carry no limit_req, so they are never 429s.

	# GAP-ADMIN-P0-1 — nginx sits behind Coolify's Traefik, so
	# $binary_remote_addr is the proxy's internal IP, not the visitor's,
	# and the 50 req/s budget would be shared by every visitor. Trust
	# X-Forwarded-For from the private (Docker) networks so the limit
	# is per real client IP.
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;

	# Queue #12 Phase C: gzip for compressible text assets (none was enabled;
	# JS/CSS were served identity-encoded).
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

	# Queue #12 Phase C: Vite build output under these directories is
	# content-hashed, so it can be cached immutably for a year.
	location /entries/
	{
		# GAP-ADMIN-P0-1 — content-hashed statics are immutable and
		# cannot be brute-forced; rate-limiting them 429s lazy chunks
		# and kills the SPA via the error boundary. The limit stays on
		# `/` (HTML shell) and API paths.
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /chunks/
	{
		# GAP-ADMIN-P0-1 — content-hashed statics are immutable and
		# cannot be brute-forced; rate-limiting them 429s lazy chunks
		# and kills the SPA via the error boundary. The limit stays on
		# `/` (HTML shell) and API paths.
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /assets/
	{
		# GAP-ADMIN-P0-1 — content-hashed statics are immutable and
		# cannot be brute-forced; rate-limiting them 429s lazy chunks
		# and kills the SPA via the error boundary. The limit stays on
		# `/` (HTML shell) and API paths.
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Queue #12 Phase C: the HTML shell must revalidate on every load so a
	# new deploy takes effect immediately (the ETag makes this a cheap 304).
	location = /index.html
	{
		limit_req zone=mylimit burst=100 nodelay;
		add_header Cache-Control "no-cache";
	}

	location /
	{
		limit_req zone=mylimit burst=100 nodelay;
		# First attempt to serve request as file, then as directory,
		# then as index.html, then fall back to displaying a 404.
		try_files $uri $uri/ /index.html =404;
	}

	location /cdn
	{
		alias /var/www/cdn;
	}
}
